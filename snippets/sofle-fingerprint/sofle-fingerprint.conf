# HLK-ZW0906 指纹模块（TouchPass）— 仅左手（central）启用
#
# 由 build.yaml 里左手变体的 `snippets:` 引入（`-S sofle-fingerprint`）。
# 右手不接指纹模块，不得开启本 snippet。

CONFIG_ZMK_TOUCHPASS=y
CONFIG_SERIAL=y
CONFIG_ZMK_TOUCHPASS_SERIAL_RPC=y

# 常驻轮询模式：开启后无需按 &touchpass，手指放上即自动识别输入（会增加功耗）
# CONFIG_ZMK_TOUCHPASS_ALWAYS_ON=y

# 依赖的子系统
CONFIG_USB_DEVICE_STACK=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_REBOOT=y

# 避免与 TouchPass Serial RPC 抢占串口导致 JSON 损坏
CONFIG_ZMK_USB_LOGGING=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
