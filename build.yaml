# Sofle 固件构建矩阵 —— main 分支（板载 SSD1306 OLED + DYA Studio）
#
# 由 `west zmk-build` 驱动（来自 cormoran/zmk-west-commands）。
# 注意：artifact 字段名是 `artifact`，不是官方工作流的 `artifact-name`。
#
# 本分支只出 OLED 固件；nice!view 变体在 niceview 分支。
#
# 左手变体必须同时带 `sofle-central` 与 `studio-rpc-usb-uart` snippet：
# 前者装载 DYA Studio 全部 Kconfig，后者提供 USB CDC-ACM 传输通道。
# 右手只带 `sofle-peripheral`，绝不能开 Studio RPC。
#
# ⚠️ Sofle 每半各有一枚 EC11 编码器，overlay 里已 status = "okay"。
#    CONFIG_EC11 在 config/sofle.conf 里两半共用，编码器事件经
#    zmk-behavior-runtime-sensor-rotate（RSR）在 DYA Studio 里按层配置。
#
# Studio 解锁状态：左手的 sofle-central snippet 里设了
# CONFIG_ZMK_STUDIO_LOCKING=n —— 固件默认处于 unlock（常开）状态，
# 断开连接后不会被重新锁定；keymap 上的 &studio_unlock 作为兜底保留。
#
---
include:
  # ================= OLED（SSD1306 128x32）=================
  - board: nice_nano//zmk
    shield: sofle_left
    snippets: [sofle-oled, sofle-central, studio-rpc-usb-uart]
    artifact: sofle_left_oled
  - board: nice_nano//zmk
    shield: sofle_right
    snippets: [sofle-oled, sofle-peripheral]
    artifact: sofle_right_oled

  # ================= 设置重置固件 =================
  # 刷这个可以把 DYA Studio 里改坏的设置恢复默认
  - board: nice_nano//zmk
    shield: settings_reset
    artifact: settings_reset
